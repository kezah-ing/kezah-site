name: Unpack site
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack the zip and tidy up
        run: |
          set -e
          ZIP=$(find . -name '*.zip' -not -path './.git/*' | head -1)
          echo "Found: $ZIP"
          mkdir /tmp/site
          unzip -q "$ZIP" -d /tmp/site
          git rm -rq --ignore-unmatch . ':!.github/workflows/unpack.yml'
          cp -a /tmp/site/. .
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Unpack site files"
          git push
